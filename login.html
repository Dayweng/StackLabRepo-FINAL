<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StackLab Academy — Sign In</title>

  <script src="https://cdn.tailwindcss.com"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet" />

  <link rel="stylesheet" href="styles.css" />

  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: { brand: '#00A3FF', navy: '#082B43' },
          fontFamily: {
            sans: ["'Space Grotesk'", 'sans-serif'],
            nasa: ['"Nasalization"', 'sans-serif'],
            rig:  ['"Rig Shaded"',  'sans-serif'],
          }
        }
      }
    }
  </script>
</head>
<body class="antialiased" style="background:#071B2F;min-height:100vh;display:flex;align-items:center;justify-content:center;">

  <!-- #region BACKGROUND ORBS -->
  <div style="position:fixed;width:520px;height:520px;background:radial-gradient(circle,rgba(0,163,255,0.28) 0%,transparent 70%);top:-120px;right:-80px;border-radius:50%;filter:blur(80px);pointer-events:none;"></div>
  <div style="position:fixed;width:360px;height:360px;background:radial-gradient(circle,rgba(11,60,93,0.7) 0%,transparent 70%);bottom:40px;left:8%;border-radius:50%;filter:blur(80px);pointer-events:none;"></div>

  <!-- #endregion -->

  <!-- #region LOGIN CARD -->
  <div class="relative z-10 w-full max-w-[420px] mx-auto px-5">

    <a href="index.html" class="flex items-center justify-center gap-3 mb-9">
      <img src="logo.png" alt="StackLab Academy" class="w-10 h-10 object-contain" />
      <div class="flex flex-col leading-none gap-1">
        <span class="font-nasa text-[13px] tracking-wide text-white">STACKLAB</span>
        <span class="font-nasa text-[8px] tracking-widest" style="color:rgba(255,255,255,0.4);">ACADEMY™</span>
      </div>
    </a>

    <div style="background:rgba(255,255,255,0.05);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border:1px solid rgba(255,255,255,0.1);border-radius:22px;padding:36px;">

      <h1 class="font-rig text-[26px] text-white tracking-wide mb-1">Welcome back</h1>
      <p style="color:rgba(255,255,255,0.45);font-size:13px;margin-bottom:24px;">Sign in to your StackLab account</p>

      <div id="authMsg" style="display:none;padding:12px 16px;border-radius:12px;font-size:13px;font-weight:500;margin-bottom:18px;"></div>

      <form method="POST" action="auth/login.php" style="display:flex;flex-direction:column;gap:16px;">

        <div style="display:flex;flex-direction:column;gap:7px;">
          <label style="font-size:11px;font-weight:700;color:rgba(255,255,255,0.5);text-transform:uppercase;letter-spacing:0.08em;">Email</label>
          <div style="display:flex;align-items:center;gap:10px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:11px 14px;">
    
            <input type="email" name="email" placeholder="Enter your email" required
              style="background:none;border:none;outline:none;color:white;font-size:13.5px;width:100%;font-family:inherit;" />
          </div>
        </div>

        <div style="display:flex;flex-direction:column;gap:7px;">
          <label style="font-size:11px;font-weight:700;color:rgba(255,255,255,0.5);text-transform:uppercase;letter-spacing:0.08em;">Password</label>
          <div style="display:flex;align-items:center;gap:10px;background:rgba(255,255,255,0.06);border:1px solid rgba(255,255,255,0.1);border-radius:12px;padding:11px 14px;">
            <input type="password" name="password" placeholder="Enter your password" required
              style="background:none;border:none;outline:none;color:white;font-size:13.5px;width:100%;font-family:inherit;" />
          </div>
        </div>

        <button type="submit"
          style="background:#00A3FF;box-shadow:0 4px 16px rgba(0,163,255,0.5);color:white;font-weight:700;font-size:14px;padding:13px;border-radius:12px;border:none;cursor:pointer;margin-top:4px;transition:background 0.2s,transform 0.15s;"
          onmouseover="this.style.background='#1D4ED8';this.style.transform='translateY(-1px)'"
          onmouseout="this.style.background='#00A3FF';this.style.transform=''">
          Sign In
        </button>
      </form>
    </div>

    <p style="text-align:center;color:rgba(255,255,255,0.2);font-size:11.5px;margin-top:20px;">
      <a href="index.html" style="color:inherit;text-decoration:none;" onmouseover="this.style.color='rgba(255,255,255,0.45)'" onmouseout="this.style.color='rgba(255,255,255,0.2)'">← Back to StackLab Academy</a>
    </p>
  </div>

  <!-- #endregion -->

  <!-- #region SCRIPTS -->
  <script>
    const p = new URLSearchParams(window.location.search);
    const m = document.getElementById('authMsg');
    const errorMap = {
      empty:   'Please fill in all fields.',
      invalid: 'Incorrect email or password.',
    };
    if (p.has('error') && errorMap[p.get('error')]) {
      m.textContent = errorMap[p.get('error')];
      m.style.display = 'block';
      m.style.background = 'rgba(239,68,68,0.13)';
      m.style.border = '1px solid rgba(239,68,68,0.28)';
      m.style.color = '#FCA5A5';
    }
    if (p.get('deleted') === '1') {
      m.textContent = 'Your account has been deleted.';
      m.style.display = 'block';
      m.style.background = 'rgba(34,197,94,0.12)';
      m.style.border = '1px solid rgba(34,197,94,0.28)';
      m.style.color = '#86EFAC';
    }
  </script>
  <!-- #endregion -->
</body>
</html>
